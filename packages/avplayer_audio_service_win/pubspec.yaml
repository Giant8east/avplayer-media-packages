name: avplayer_audio_service_win
description: Customized Windows system-media-session support for avplayer audio playback.
version: 0.0.3+1
homepage: https://github.com/Giant8east/avplayer-media-packages/tree/main/packages/avplayer_audio_service_win
repository: https://github.com/Giant8east/avplayer-media-packages
issue_tracker: https://github.com/Giant8east/avplayer-media-packages/issues

environment:
  sdk: ^3.6.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  audio_service_platform_interface: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: audio_service_platform_interface
    platforms:
      windows:
        dartPluginClass: AudioServiceWin
        fileName: avplayer_audio_service_win.dart
        pluginClass: AudioServiceWinPluginCApi
